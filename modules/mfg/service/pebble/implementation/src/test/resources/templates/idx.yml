metadata:
  name: Spring Boot REST Service
  version: 1.0.0
  description: Generates a complete RESTful service with Spring Boot
  author: Mifos Initiative

parameters:
  - name: className
    type: STRING
    required: true
    description: Name of the class
    default: World
    pattern: "^[A-Za-z][A-Za-z0-9]*$"
    message: Service name must start with a letter and contain only alphanumeric characters

files:
  - path: "src/main/java/Foo{{clasName}}.java"
    template: "content/Foo.peb"
    type: PEBBLE
  - path: "src/main/java/Bar{{clasName}}.java"
    template: "content/Bar.peb"
    type: PEBBLE
