buildscript {
    repositories {
        mavenLocal()
        mavenCentral().content {
            excludeModule("javax.media", "jai_core")
        }
        gradlePluginPortal()
        maven {
            url = uri("https://central.sonatype.com/repository/maven-snapshots")
        }
        maven {
            url = uri("https://mifos.jfrog.io/artifactory/mifosx-gradle-local")
        }
    }

    dependencies {
        classpath "org.mifos.conventions.gradle:mifos-conventions-gradle-boot-layout:0.1.0-SNAPSHOT"
    }
}

apply plugin: "org.mifos.conventions.gradle.boot.layout"

rootProject.name = "mifos-tools"

mifos {
    project {
        groupId = "org.mifos.tools"
        description = "Mifos Tools"
        basePackage = "org.mifos.tools"
        basePath = "org/mifos/tools"
        inceptionYear = "2026"
    }

    developers {
        "vidakovic" {
            firstname = "Aleksandar"
            lastname = "Vidakovic"
            email = "aleks@mifos.org"
            timezone = "UTC+2"
            roles = ["developer", "architect"]
        }
    }
}
